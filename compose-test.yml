name: simple-tasks-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simple_tasks_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '${TEST_DATABASE_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d simple_tasks_test']
      interval: 1s
      timeout: 3s
      retries: 20
