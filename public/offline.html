<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#32654b" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f5f6f5;
        --surface: #fff;
        --foreground: #202724;
        --muted: #65716a;
        --accent: #32654b;
        --on-accent: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 40px 32px;
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 18px 54px #2027240c;
      }
      img {
        display: block;
        width: 56px;
        height: 56px;
        margin-bottom: 32px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.035em;
      }
      p {
        margin: 16px 0 28px;
        color: var(--muted);
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        padding: 10px 20px;
        border-radius: 10px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #151a17;
          --surface: #202823;
          --foreground: #edf2ee;
          --muted: #a5b3a9;
          --accent: #afd4b6;
          --on-accent: #183321;
        }
      }
      @media (forced-colors: active) {
        main {
          border: 1px solid CanvasText;
          box-shadow: none;
        }
        a {
          border: 1px solid LinkText;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icons/icon-192.png"
        width="56"
        height="56"
        alt="Simple Tasks"
      />
      <h1 id="heading">Sin conexión</h1>
      <p id="message">
        Conéctate a internet para consultar tus tareas y guardar cambios
      </p>
      <a id="retry" href="/">Volver a intentar</a>
    </main>
    <script>
      if (location.pathname !== '/offline.html')
        document.getElementById('retry').href = location.href;
      if (!navigator.language.toLowerCase().startsWith('es')) {
        document.documentElement.lang = 'en';
        document.title = 'You are offline';
        document.getElementById('heading').textContent = 'You are offline';
        document.getElementById('message').textContent =
          'Connect to the internet to view your tasks and save changes';
        document.getElementById('retry').textContent = 'Try again';
      }
    </script>
  </body>
</html>
